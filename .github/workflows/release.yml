name: Release

# Version changes on main, version tags and manual runs publish to PyPI after the checks in
# ci.yml pass.
# Tag-triggered runs also verify the tag matches hanakura/version.py.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['hanakura/version.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # scripts/build_wheel.py reads this: the web type-check runs in ci.yml.
  CI: '1'

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the wheel
    needs: [checks]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - run: uv pip install --system build twine

      - name: The tag and hanakura/version.py agree
        id: version
        run: |
          version=$(python -c "from hanakura.version import VERSION; print(VERSION)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in hanakura/version.py"
              exit 1
            fi
          fi

      # Builds the web UI with bun first: setuptools packages only the files that exist then.
      - name: Build
        run: python scripts/build_wheel.py --ci

      - name: The wheel carries the web UI
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.startswith("hanakura/webui/dist/") for n in names), "the wheel has no web UI"
          assert "hanakura/webui/dist/index.html" in names, "the wheel has no index.html"
          assert any(n.endswith("rules_data/diffusion.json") for n in names), "the wheel has no detection rules"
          print(wheel.name, f"{wheel.stat().st_size / 1e6:.1f} MB", len(names), "files")
          PY

      - name: Check the metadata
        run: twine check dist/*

      - name: The wheel installs and runs
        run: |
          uv venv /tmp/probe
          uv pip install --quiet --python /tmp/probe dist/*.whl
          /tmp/probe/bin/hanakura version
          /tmp/probe/bin/python -c "import hanakura; print(hanakura.VERSION)"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment can require an approval before a release.
    environment:
      name: pypi
      url: https://pypi.org/p/hanakura
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install Twine
        run: uv pip install --system twine
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: python -m twine upload dist/* --skip-existing --non-interactive

  github-release:
    name: GitHub release
    needs: [build, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
